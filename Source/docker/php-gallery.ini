; PHP settings for the gallery container.
; Painting image uploads (artwork/uploads.php): files up to 5 MB, decoded with GD.
upload_max_filesize = 6M
post_max_size = 8M
memory_limit = 256M
; Errors go to the container log (docker compose logs web), not into pages.
; A request over post_max_size otherwise prints a warning before the page
; starts, which breaks its session and the "image too large" message.
display_errors = Off
log_errors = On
